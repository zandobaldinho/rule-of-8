<title>Demo regra de 8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: casca do sistema (menu 224 + área que rola). Duas telas no mesmo
   arquivo: "atual" copia a /vendas/painel de hoje (medidas do código),
   "proposta" é a mesma informação refeita na grade de 8 e nas 8 regras de ouro. */
:root {
  --app: #111315; --surface: #1c1e21; --surface-2: #272a2e; --hairline: #3a3f45; --borda: #77808a;
  --ink: #f5f5f7; --ink-2: #c5c8cd; --ink-3: #a9afb8;
  --accent: #d4ff1a; --on-accent: #0a0a0b; --danger: #f06560; --warn: #d9a441; --ok: #5fb37a;
  --serie: #3987e5; --serie-trilho: #1f3350; --comparada: #8a9099;
  --r1: #256abf; --r2: #3987e5; --r3: #6da7ec; --r4: #9ec5f4; --r5: #cde2fb;
  --grade: rgb(212 255 26 / 0.10); --grade-forte: rgb(212 255 26 / 0.22); --overlay: rgb(0 0 0 / 0.55);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --app: #f4f3ee; --surface: #ffffff; --surface-2: #eeede8; --hairline: #d6d5cf; --borda: #787870;
  --ink: #20211f; --ink-2: #51534e; --ink-3: #666963;
  --accent: #487000; --on-accent: #ffffff; --danger: #c8322d; --warn: #925600; --ok: #267341;
  --serie: #265bb7; --serie-trilho: #dbe7fa; --comparada: #8b8d87;
  --r1: #86b6ef; --r2: #5598e7; --r3: #2a78d6; --r4: #1c5cab; --r5: #104281;
  --grade: rgb(72 112 0 / 0.10); --grade-forte: rgb(72 112 0 / 0.24); --overlay: rgb(20 20 20 / 0.45);
  color-scheme: light;
} }
:root[data-theme="light"] {
  --app: #f4f3ee; --surface: #ffffff; --surface-2: #eeede8; --hairline: #d6d5cf; --borda: #787870;
  --ink: #20211f; --ink-2: #51534e; --ink-3: #666963;
  --accent: #487000; --on-accent: #ffffff; --danger: #c8322d; --warn: #925600; --ok: #267341;
  --serie: #265bb7; --serie-trilho: #dbe7fa; --comparada: #8b8d87;
  --r1: #86b6ef; --r2: #5598e7; --r3: #2a78d6; --r4: #1c5cab; --r5: #104281;
  --grade: rgb(72 112 0 / 0.10); --grade-forte: rgb(72 112 0 / 0.24); --overlay: rgb(20 20 20 / 0.45);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--app); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 24px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, p { margin: 0; }

.casca { display: flex; height: 100%; }
.lateral { width: 224px; flex-shrink: 0; background: var(--surface); box-shadow: inset -1px 0 var(--hairline); display: flex; flex-direction: column; padding: 24px 8px; gap: 8px; }
.marca { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; margin-bottom: 8px; font-weight: 700; }
.marca i, .barra-topo i { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); display: inline-block; }
.item-nav { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; color: var(--ink-2); font-size: 14px; border: 0; background: none; text-align: left; width: 100%; }
.item-nav:hover { background: var(--surface-2); color: var(--ink); }
.item-nav[aria-current] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.item-nav svg { width: 16px; height: 16px; flex-shrink: 0; }
.area { flex: 1; min-width: 0; overflow-y: auto; }
.conteudo { position: relative; max-width: 1280px; margin: 0 auto; padding-block: 24px 96px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.grade .conteudo::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background-image: linear-gradient(to bottom, var(--grade-forte) 1px, transparent 1px), linear-gradient(to bottom, var(--grade) 1px, transparent 1px), linear-gradient(to right, var(--grade) 1px, transparent 1px);
  background-size: 100% 64px, 100% 8px, 8px 100%; }
.barra-topo { display: none; }

/* Botões comuns às duas telas */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; height: 40px; padding: 0 16px; border-radius: 8px; font-size: 14px; line-height: 24px; border: 0; }
.btn svg { width: 16px; height: 16px; }
.btn-prim { background: var(--ink); color: var(--app); font-weight: 600; }
.btn-acento { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn-sec { background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink); font-weight: 500; }
.btn-sec:hover { background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-p { height: 32px; padding: 0 12px; font-size: 12px; line-height: 16px; }

/* ═══════════════ TELA DE HOJE (medidas lidas do código atual) ═══════════════ */
.atual { display: grid; gap: 20px; }
.atual .cabt { display: flex; gap: 12px; align-items: flex-start; }
.atual .cabt .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
.atual .cabt h1 { font-size: 24px; line-height: 32px; font-weight: 600; }
.atual .cabt p { font-size: 14px; line-height: 20px; color: var(--ink-2); margin-top: 2px; }
.atual .navm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.atual .navm .btn { height: 44px; padding: 0 14px; }
.atual .navm strong { padding: 0 8px; font-size: 14px; }
.atual .caixa { border-radius: 12px; box-shadow: inset 0 0 0 1px var(--hairline); background: var(--surface); padding: 16px; min-width: 0; }
.atual .form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.atual label { font-size: 14px; line-height: 20px; color: var(--ink-2); }
.atual label input { display: block; margin-top: 4px; height: 44px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--app); padding: 0 12px; font-size: 16px; }
.atual .k3 { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0,1fr)); }
.atual .k3 p:first-child, .atual .t4 p { font-size: 14px; line-height: 20px; color: var(--ink-2); }
.atual .k3 .v { margin-top: 4px; font-size: 20px; line-height: 28px; font-weight: 700; }
.atual h2 { font-size: 16px; line-height: 24px; font-weight: 600; }
.atual .exp { font-size: 14px; line-height: 20px; color: var(--ink-3); }
.atual .t4 { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0,1fr)); margin-top: 12px; }
.atual .t4 > div { border-radius: 8px; background: var(--app); padding: 12px; }
.atual .t4 strong { display: block; margin-top: 4px; font-size: 20px; line-height: 28px; }
.atual .txt { font-size: 14px; line-height: 20px; color: var(--ink-2); margin-top: 8px; }
.atual table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; text-align: left; }
.atual th, .atual td { padding: 8px; }
.atual thead tr { color: var(--ink-2); box-shadow: inset 0 -1px var(--hairline); }
.atual tbody tr { box-shadow: inset 0 -1px var(--hairline); }
.atual .rolar { overflow-x: auto; }
.atual .k8 { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0,1fr)); }
.atual .k8 > div { border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hairline); background: var(--surface); padding: 16px; }
.atual .k8 p { font-size: 13px; line-height: 18px; color: var(--ink-3); }
.atual .k8 strong { display: block; font-size: 24px; line-height: 32px; margin-top: 4px; }
.atual .camp { display: block; margin-top: 4px; width: 176px; height: 44px; border-radius: 8px; border: 1px solid var(--borda); background: var(--app); padding: 0 12px; font-size: 16px; }

/* ═══════════════ PROPOSTA (grade de 8) ═══════════════ */
.prop { display: grid; gap: 24px; }
.p-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.p-cab h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
.p-cab .sub { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--ink-3); }
.p-cab .dir { display: flex; align-items: center; gap: 16px; }
.atualizado { font-size: 12px; line-height: 16px; color: var(--ink-3); }
.controles { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
.grupo { display: flex; align-items: center; gap: 8px; }
.grupo > span { font-size: 12px; line-height: 16px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.passo { display: flex; align-items: center; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hairline); background: var(--surface); height: 40px; }
.passo button { width: 40px; height: 40px; border: 0; background: none; color: var(--ink-2); border-radius: 8px; display: grid; place-items: center; }
.passo button:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.passo button:disabled { opacity: .3; cursor: not-allowed; }
.passo button svg { width: 16px; height: 16px; }
.passo .rotulo { min-width: 120px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 8px; }
.sel { height: 40px; border-radius: 8px; border: 0; box-shadow: inset 0 0 0 1px var(--hairline); background: var(--surface); padding: 0 16px; font-size: 14px; }

.cartao { position: relative; background: var(--surface); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hairline); padding: 24px; min-width: 0; }
.rot { font-size: 12px; line-height: 16px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

/* Meta do dia */
.dia-topo { display: flex; justify-content: space-between; align-items: center; height: 24px; }
.link { border: 0; background: none; padding: 0; color: var(--ink-2); font-size: 12px; line-height: 24px; text-decoration: underline; text-underline-offset: 3px; }
.dia-num { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; min-height: 40px; flex-wrap: wrap; }
.dia-num strong { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em; }
.dia-num > span:not(.pill) { color: var(--ink-2); font-size: 16px; line-height: 24px; }
.dia-num .pill { margin-left: auto; align-self: center; }
.trilho { height: 16px; border-radius: 8px; background: var(--serie-trilho); margin-top: 16px; overflow: hidden; position: relative; }
.trilho i { position: absolute; inset: 0 auto 0 0; background: var(--serie); border-radius: 8px; transition: width .3s ease; }
.trilho.ok i { background: var(--ok); }
@media (prefers-reduced-motion: reduce) { .trilho i, .mini i { transition: none; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-top: 16px; }
.stat { display: grid; min-width: 0; }
.stat span { font-size: 12px; line-height: 16px; color: var(--ink-3); }
.stat b { font-size: 16px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.como { margin-top: 16px; padding-top: 16px; box-shadow: inset 0 1px var(--hairline); color: var(--ink-2); font-size: 14px; line-height: 24px; max-width: 72ch; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.prop { container-type: inline-size; }
@container (max-width: 1064px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@container (max-width: 560px) { .kpis { grid-template-columns: 1fr; } }
.kpi { display: grid; grid-template-rows: 16px 32px 32px; gap: 8px; }
.kpi .v { font-size: 24px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .pe { display: flex; align-items: center; gap: 8px; min-width: 0; }
.kpi .pe small { font-size: 12px; line-height: 16px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink-2); }
.pill.ok { color: var(--ok); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.pill.atr { color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.pill.ate { color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }

.linha2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; }
.c-topo { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 24px; flex-wrap: wrap; }
.c-topo h2 { font-size: 16px; line-height: 24px; font-weight: 600; }
.c-sub { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--ink-3); }
.legenda { display: flex; flex-wrap: wrap; gap: 0 16px; font-size: 12px; line-height: 24px; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.legenda i { width: 16px; height: 2px; background: var(--serie); display: inline-block; }
.legenda i.cmp { background: var(--comparada); }
.legenda i.prj { background: none; border-top: 2px dashed var(--serie); height: 0; }
.legenda i.sq { width: 8px; height: 8px; border-radius: 2px; }
.graf { position: relative; margin-top: 16px; height: 240px; }
.graf svg { display: block; width: 100%; height: 240px; overflow: visible; }
.graf text { font-family: var(--font); font-size: 12px; fill: var(--ink-3); }
.graf .rotfim { fill: var(--ink); font-weight: 600; }
.dica { position: absolute; pointer-events: none; background: var(--ink); color: var(--app); border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 3; transform: translate(-50%, -100%); }
.dica b { display: block; }

.cobrar { display: grid; margin-top: 16px; }
.cob { display: flex; align-items: center; gap: 16px; height: 64px; box-shadow: inset 0 -1px var(--hairline); }
.cob:last-child { box-shadow: none; }
.cob .t { flex: 1; min-width: 0; display: grid; }
.cob .t b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cob .t span { font-size: 12px; line-height: 16px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cob.feito .t b { color: var(--ink-3); text-decoration: line-through; }

/* Tabela de vendedores */
.t-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; min-height: 32px; }
.t-topo h2 { font-size: 16px; line-height: 24px; font-weight: 600; }
.chave { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.chave[aria-pressed="true"] { background: var(--ink); color: var(--app); }
.tab { margin-top: 16px; }
.tab-cab, .tab-lin { display: grid; grid-template-columns: minmax(144px, 1.1fr) minmax(176px, 1.3fr) minmax(112px, .8fr) minmax(176px, 1.3fr) 64px minmax(192px, 1.4fr); column-gap: 24px; align-items: center; }
.tab-cab { height: 40px; box-shadow: inset 0 -1px var(--hairline); }
.tab-cab button { border: 0; background: none; padding: 0; text-align: left; font-size: 12px; line-height: 16px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; display: inline-flex; gap: 4px; align-items: center; height: 40px; }
.tab-cab button[aria-sort="ascending"]::after { content: "↑"; }
.tab-cab button[aria-sort="descending"]::after { content: "↓"; }
.tab-cab .dirr, .tab-lin .dirr { justify-self: end; }
.tab-lin { height: 56px; box-shadow: inset 0 -1px var(--hairline); }
.tab-lin:last-child { box-shadow: none; }
.tab-lin .nome { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.par-v { display: grid; gap: 4px; }
.par-v .vals { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.par-v .vals small { color: var(--ink-3); font-size: 12px; }
.mini { height: 8px; border-radius: 4px; background: var(--serie-trilho); position: relative; overflow: hidden; }
.mini i { position: absolute; inset: 0 auto 0 0; background: var(--serie); border-radius: 4px; transition: width .3s ease; }
.mini.ok i { background: var(--ok); }
.falta { font-variant-numeric: tabular-nums; }
.falta.zero { color: var(--ok); font-weight: 600; }
.seg { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; }
.seg i { display: block; height: 8px; min-width: 2px; }
.rec { display: grid; gap: 8px; }
.rec small { font-size: 12px; line-height: 16px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c1 { background: var(--r1); } .c2 { background: var(--r2); } .c3 { background: var(--r3); } .c4 { background: var(--r4); } .c5 { background: var(--r5); }

/* Diálogo da meta, atalhos, toast */
.fundo { position: fixed; inset: 0; background: var(--overlay); z-index: 20; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.dlg { width: min(480px, 100%); background: var(--app); border-radius: 16px; box-shadow: 0 0 0 1px var(--hairline), 0 24px 48px rgb(0 0 0 / .3); padding: 24px; display: grid; gap: 24px; }
.dlg h2 { font-size: 20px; line-height: 32px; font-weight: 600; }
.dlg .campo { display: grid; gap: 8px; font-size: 12px; line-height: 16px; color: var(--ink-3); font-weight: 600; }
.dlg .campo input { height: 48px; border-radius: 8px; border: 1px solid var(--borda); background: var(--surface); padding: 0 16px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.previa { display: grid; gap: 8px; border-radius: 8px; background: var(--surface); padding: 16px; }
.previa div { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.previa span { color: var(--ink-3); }
.previa .seta { color: var(--ink-3); padding: 0 8px; }
.alerta { font-size: 14px; line-height: 24px; color: var(--warn); }
.dlg .rod { display: flex; justify-content: flex-end; gap: 8px; }
.atalhos { display: grid; gap: 8px; }
.atalhos div { display: flex; justify-content: space-between; gap: 16px; height: 32px; align-items: center; }
kbd { font-family: var(--mono); font-size: 12px; line-height: 16px; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px)); transform: translateX(-50%); background: var(--ink); color: var(--app); padding: 8px 8px 8px 16px; border-radius: 8px; font-size: 14px; line-height: 24px; z-index: 40; max-width: calc(100% - 32px); display: flex; gap: 16px; align-items: center; }
.toast button { border: 0; background: none; color: var(--app); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; height: 32px; padding: 0 8px; }
.vivo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Marcas das 8 regras (só com o botão "8 regras") */
.regra { display: none; position: absolute; top: -8px; right: -8px; z-index: 6; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: 700 12px/24px var(--mono); text-align: center; pointer-events: none; }
.regras .regra { display: block; }
.rel { position: relative; }
.painel-regras { position: fixed; top: 0; right: 0; bottom: 0; width: min(352px, 100%); background: var(--app); box-shadow: -1px 0 var(--hairline), -16px 0 32px rgb(0 0 0 / .2); z-index: 25; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 96px 24px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.painel-regras h2 { font-size: 16px; line-height: 24px; }
.painel-regras ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }

  const cent = (n) => Math.ceil(Math.round(n * 1000) / 10) / 100
  const pct = (n) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(n) + '%'
  const cap = (s) => s[0].toUpperCase() + s.slice(1)
  const NOV = { 2: 118400, 3: 142300, 4: 151900, 5: 139700, 6: 160200, 9: 147100, 10: 160400, 11: 41890 }
  const OUT = { 1: 131200, 2: 128900, 5: 140300, 6: 135600, 7: 142800, 8: 139100, 9: 150500, 12: 146200, 13: 151800, 14: 138900, 15: 149300, 16: 157600, 19: 141700, 20: 152400, 21: 147900, 22: 139800, 23: 161200, 26: 148300, 27: 144600, 28: 156100, 29: 150700, 30: 168400 }
  const SET = { 1: 125400, 2: 131800, 3: 127300, 4: 138900, 5: 129600, 8: 134200, 9: 141700, 10: 136000, 11: 137400, 14: 140100, 15: 133800, 16: 145200, 17: 138600, 18: 150300, 21: 139900, 22: 142700, 23: 136400, 24: 147800, 25: 151200, 28: 144900, 29: 139300, 30: 158600 }
  const COMP = { '2026-10': { nome: 'outubro', serie: OUT, dias: 31, semValor: 0 }, '2026-09': { nome: 'setembro', serie: SET, dias: 30, semValor: 1 } }
  const HOJE = 11
  const uteisNov = []; for (let d = 1; d <= 30; d++) { const w = new Date(2026, 10, d).getDay(); if (w !== 0 && w !== 6) uteisNov.push(d) }

  ]
  // rec = [sem recebimento, sinal, parcial, produto pago e frete aberto, quitado]
  const REC = ['Sem recebimento', 'Sinal', 'Parcial', 'Produto pago, frete aberto', 'Quitado']
  const cobrancas = [
    { num: '26100288', cliente: 'Oficina Rota Sul', det: 'Pronto para expedição há 6 dias', vend: 'Bruno' },

  ]
  const st = { dia: HOJE, comp: '2026-10', meta: 2400000, soAbaixo: false, ordem: { col: 'faltaHoje', dir: -1 }, cobrados: new Set(), como: false, dlg: null, metaRasc: '' }

  // ── Cálculo (mesma regra do sistema: metaDiariaComercial) ────────────────
  function calc(dia = st.dia, meta = st.meta) {
    const antes = Object.entries(NOV).filter(([d]) => +d < dia).reduce((s, [, v]) => s + v, 0)
    const feito = NOV[dia] ?? 0
    const dias = uteisNov.filter((d) => d >= dia).length
    const equipe = Math.max(0, cent((meta - antes) / dias))
    const porVend = cent(equipe / vendedores.length)
    const vendido = antes + feito
    const faltaMes = Math.max(0, meta - vendido)
    const ritmo = cent(faltaMes / Math.max(1, dias - 1))
    const c = COMP[st.comp]
    const ateC = Math.min(dia, c.dias)
    const totalC = Object.entries(c.serie).filter(([d]) => +d <= ateC).reduce((s, [, v]) => s + v, 0)
    const feitoC = c.serie[ateC] ?? null
    // Vendedor num dia anterior: a venda do dia repartida pelo peso do mês (em 11/11, o número real).
    const escala = vendido / 1061890
    const pesoTot = vendedores.reduce((s, v) => s + v.mes, 0)
    const vs = vendedores.map((v, i) => {
      const hoje = dia === HOJE ? v.hoje : Math.round(feito * (v.mes / pesoTot) / 10) * 10
      const mes = Math.round(v.mes * escala)
      return { ...v, i, hoje, mes, quit: v.rec[4], faltaHoje: Math.max(0, porVend - hoje), faltaMes: Math.max(0, v.meta - mes) }
    })
    return { antes, feito, dias, equipe, porVend, vendido, faltaMes, ritmo, totalC, feitoC, ateC, c, vs, faltaHoje: Math.max(0, equipe - feito) }
  }

  }

              <span class="falta ${v.faltaHoje === 0 ? 'zero' : ''}"><span class="so-cel">Falta hoje </span>${v.faltaHoje === 0 ? 'Bateu o dia' : brl0(v.faltaHoje)}</span>

  // Gráfico: acumulado por dia, novembro × mês comparado + ritmo até a meta.
  function desenharGrafico() {
    const box = document.getElementById('graf'); if (!box) return
    const W = box.clientWidth, H = 240, ml = 56, mr = W < 480 ? 56 : 88, mt = 8, mb = 24
    const r = calc()
    const acum = (serie, ate) => { let s = 0; const pts = []; for (let d = 1; d <= ate; d++) { s += serie[d] ?? 0; pts.push([d, s]) } return pts }
    const nov = acum(NOV, st.dia), cmp = acum(r.c.serie, r.c.dias)
    const ymax = 3200000
    const x = (d) => ml + (d - 1) / 30 * (W - ml - mr) // eixo de 31 dias; novembro termina no 30

    const fimN = nov[nov.length - 1], fimC = cmp[cmp.length - 1]
    const grid = [0, 1000000, 2000000, 3000000].map((v) => `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hairline)" stroke-width="1"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${v ? v / 1e6 + ' mi' : '0'}</text>`).join('')
    const xt = [1, 8, 15, 22, 30].map((d) => `<text x="${x(d)}" y="${H - 4}" text-anchor="middle">${String(d).padStart(2, '0')}</text>`).join('')
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Acumulado de novembro até o dia ${st.dia}: ${brl0(fimN[1])}. ${cap(r.c.nome)} fechou em ${brl0(fimC[1])}. Meta ${brl0(st.meta)}.">
      ${grid}${xt}

      <path d="${path(cmp)}" fill="none" stroke="var(--comparada)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${path(nov)}" fill="none" stroke="var(--serie)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${x(30)}" cy="${y(st.meta)}" r="4" fill="var(--serie)" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${x(fimN[0])}" cy="${y(fimN[1])}" r="5" fill="var(--serie)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(30) + 8}" y="${y(st.meta) + 4}" class="rotfim">Meta ${mi(st.meta)}</text>
      <text x="${x(r.c.dias) + 8}" y="${y(fimC[1]) + 4}">${cap(r.c.nome.slice(0, 3))} ${mi(fimC[1])}</text>

      <rect x="${ml}" y="${mt}" width="${Math.max(0, W - ml - mr)}" height="${H - mt - mb}" fill="transparent" id="alvo-graf"/>
    </svg><div class="dica" id="dica" hidden></div>`
    const alvo = box.querySelector('#alvo-graf'), mira = box.querySelector('#mira'), dica = box.querySelector('#dica')

      const rr = box.getBoundingClientRect()

      dica.hidden = false; dica.style.left = Math.min(Math.max(x(d), 72), W - 72) + 'px'; dica.style.top = Math.max(48, y(Math.max(vn ?? 0, vc ?? 0)) - 8) + 'px'
    })
    alvo.addEventListener('mouseleave', () => { mira.setAttribute('visibility', 'hidden'); dica.hidden = true })

  // ── Diálogos ────────────────────────────────────────────────────────────
  const parseReais = (s) => Number(String(s).replace(/\D/g, '')) || 0
  function renderCamada() {

  let tId
  function toast(msg, desfazer) {
    document.querySelector('.toast')?.remove()
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status')
    t.innerHTML = `<span>${msg}</span>${desfazer ? '<button type="button" class="desfazer">Desfazer</button>' : ''}`

    if (desfazer) t.querySelector('.desfazer').onclick = () => { t.remove(); desfazer() }
    clearTimeout(tId); tId = setTimeout(() => t.remove(), 6000)
  }
  const anunciar = (m) => { document.getElementById('vivo').textContent = m }

  function irDia(d) { st.dia = d; render(); anunciar(`Mostrando até ${rotDia(d)}, comparado com ${COMP[st.comp].nome}.`) }
  function passoDia(n) {
    const uteis = uteisNov.filter((d) => d <= HOJE)
    const i = uteis.indexOf(st.dia) + n
    if (i >= 0 && i < uteis.length) irDia(uteis[i])
  }
  function abrirMeta() { st.dlg = 'meta'; st.metaRasc = String(st.meta); renderCamada(); const i = document.getElementById('i-meta'); i.focus(); i.select() }

  document.addEventListener('click', (e) => {

    if (d.ord) { st.ordem = { col: d.ord, dir: st.ordem.col === d.ord ? -st.ordem.dir : (d.ord === 'nome' ? 1 : -1) }; render(); return }

    }
    switch (t.id) {
      case 'dia-ant': passoDia(-1); return
      case 'dia-prox': passoDia(1); return
      case 'dia-hoje': irDia(HOJE); return
      case 'como': st.como = !st.como; render(); return
      case 'so-abaixo': st.soAbaixo = !st.soAbaixo; render(); return

      case 'fundo': if (e.target.id === 'fundo') { st.dlg = null; renderCamada() } return

    if (APP.tela !== 'painel') return

  })
  document.addEventListener('input', (e) => {
    if (APP.tela !== 'painel') return
    if (e.target.id !== 'i-meta') return
    st.metaRasc = e.target.value; renderCamada()
    const i = document.getElementById('i-meta'); i.focus(); i.setSelectionRange(i.value.length, i.value.length)
  })
  document.addEventListener('submit', (e) => {
    if (APP.tela !== 'painel') return
    e.preventDefault()
    if (e.target.id === 'f-meta') {
      const antes = st.meta, novo = parseReais(st.metaRasc)
      if (!novo || novo === antes) return
      st.meta = novo; st.dlg = null; render()

      if (COMP[cv]) st.comp = cv
      render()
    } else if (e.target.id === 'f-meta-atual') {
      const v = parseReais(document.getElementById('a-meta').value); if (v) { st.meta = v; render(); toast('Meta do mês salva.') }
    }
  })
  document.addEventListener('keydown', (e) => {
    if (APP.tela !== 'painel') return
    if (e.key === 'Escape' && st.dlg) { st.dlg = null; renderCamada(); return }
    if (APP.modo !== 'proposta' || st.dlg || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) return
    if (e.key === 'ArrowLeft') passoDia(-1)
    else if (e.key === 'ArrowRight') passoDia(1)
    else if (e.key.toLowerCase() === 'h') irDia(HOJE)
    else if (e.key.toLowerCase() === 'e') { e.preventDefault(); abrirMeta() }
    else if (e.key.toLowerCase() === 'f') { st.soAbaixo = !st.soAbaixo; render() }
    else if (e.key === '?') { st.dlg = 'atalhos'; renderCamada() }

  const painelRegras = `<aside class="painel-regras" id="painel-regras" aria-label="As 8 regras de ouro nesta tela"><h2>As 8 regras de ouro nesta tela</h2><ol>

    <li><span class="n">7</span><div><b>Quem manda é a pessoa</b><span>Nada muda sozinho. Ordenar e filtrar os vendedores é escolha dela.</span></div></li>
    <li><span class="n">8</span><div><b>Menos coisa pra lembrar</b><span>A comparação aparece no gráfico e no próprio cartão; hoje e o mês ficam na mesma linha do vendedor; a conta fica a um clique.</span></div></li>
  </ol></aside>`
  TELAS.painel = { render, regras: painelRegras, fechar: () => { st.dlg = null; renderCamada() } }
})()

      <div class="h-abas" role="tablist" data-m>${abas.map(([k, r, n]) => `<button type="button" role="tab" aria-selected="${ab === k}" data-pdh-aba="${k}">${r}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
      <div class="h-busca" data-m><label>Buscar pedido ou cliente</label><button type="button" class="btn btn-sec" data-pdh-toast="Folha de filtros: prazo, resolver, ordem">Filtros</button></div>
      <p class="h-regua" data-m>${lista.length} pedidos em andamento, do mais novo ao mais antigo</p>
      <div class="h-tab" data-m><div class="h-cabt"><span>Pedido</span><span>Cliente</span><span>Carro</span><span>Envio</span><span>Valor</span><span>O que falta</span><span></span></div>
      ${lista.map((p) => `<article class="h-lin"><a href="#" data-pdh-toast="Abre o pedido ${p.num} em janela por cima"><span class="num">${p.num}</span><span><span class="nm">${esc(p.cliente)}</span><span class="sb">${p.vend} · ${dBR(p.venda)}</span></span><span class="sb">${esc(p.carro)}</span><span class="num ${sit(p) === 'atr' ? 'atr' : ''}">${dBR(p.envio)}${sit(p) === 'atr' ? ` · ${dias(p.envio)}d` : ''}</span><span class="num">${brl(p.valor)}</span><span>${p.falta.length ? p.falta.map(esc).join('<br>') : esc(p.fase)}</span></a>
        <div class="h-ac"><button type="button" class="btn ${p.acao === 'fazer_ficha' ? 'btn-prim' : 'btn-sec'}" data-pdh-toast="${ROTULO[p.acao]}">${ROTULO[p.acao]}</button><button type="button" class="lx" aria-label="Excluir pedido" data-pdh-toast="Excluir pedido: apaga o pedido e todas as fichas">${SV.lixo}</button></div></article>`).join('')}</div>
    </div>`
  }

  // ═══════════════ PROPOSTA ═══════════════
  function visiveis() {
    const q = st.q.trim().toLowerCase()
    // Linha resolvida fica no lugar até trocar de fila (regra 7)
    const l = pedidos.filter((p) => (st.fila === 'todos' || (st.fila === 'atrasados' ? sit(p) === 'atr' : st.fila === 'perto' ? sit(p) === 'prox' : filaDe(p) === st.fila) || (st.feitos.has(p.id) && st.presos.has(p.id))) && (!q || [p.num, p.cliente, p.carro, p.vend].join(' ').toLowerCase().includes(q)))
    const { col, dir } = st.ordem
    const val = (p) => col === 'envio' ? (p.envio ? new Date(p.envio).getTime() : 9e15) : col === 'valor' ? p.valor : col === 'cliente' ? p.cliente : p.num
    return l.sort((a, b) => (typeof val(a) === 'string' ? val(a).localeCompare(val(b)) : val(a) - val(b)) * dir)
  }
  function linhasAtraso(atrasadosL) {
    return atrasadosL.map((p) => {
          const adm = p.falta.length > 0, feito = st.feitos.get(p.id)
          return `<div class="at-lin" data-pd-abrir="${p.id}">
            <span class="at-dias">${dias(p.envio)}d<small>atraso</small></span>
            <span class="at-q"><b>${p.num} · ${esc(p.cliente)}</b><span>envio era ${dBR(p.envio)} · ${esc(p.carro)}</span></span>
            <span class="at-quem"><span class="pill ${adm ? 'atr' : 'ate'}">${adm ? 'ADM precisa agir' : 'Na fábrica'}</span><span>${adm ? esc(p.falta[0]) : esc(p.fase)}</span></span>
            ${feito ? `<span class="pl-ok">Resolvido<button type="button" data-pd-desfazer="${p.id}">Desfazer</button></span>` : `<button type="button" class="btn ${adm ? 'btn-prim' : 'btn-sec'}" data-pd-acao="${p.id}">${adm ? ROTULO[p.acao] : 'Avisar o cliente'}</button>`}
          </div>`
        }).join('')
  }
  function telaProposta() {
    const cont = (k) => k === 'todos' ? pedidos.length : k === 'atrasados' ? pedidos.filter((p) => sit(p) === 'atr').length : pedidos.filter((p) => filaDe(p) === k).length
    const atrasadosL = pedidos.filter((p) => sit(p) === 'atr').sort((a, b) => dias(b.envio) - dias(a.envio))
    const perto = pedidos.filter((p) => sit(p) === 'prox').length
    const travam = pedidos.filter((p) => TRAVA.has(filaDe(p))).length
    const atrasados = pedidos.filter((p) => sit(p) === 'atr' && filaDe(p) !== 'andamento').length
    const aReceber = pedidos.reduce((s, p) => s + p.parcelas.filter((c) => !c.pago).reduce((a, c) => a + c.v, 0), 0)
    const engVencido = pedidos.filter((p) => p.acao === 'engenharia' && /venceu/.test(p.falta[0] || '')).length
    const lista = visiveis()
    if (st.sel >= lista.length) st.sel = lista.length - 1
    const sortA = (c) => st.ordem.col === c ? `aria-sort="${st.ordem.dir > 0 ? 'ascending' : 'descending'}"` : ''
    const kpi = (fila, rot, v, pe) => `<button type="button" class="cartao kpi clic" data-pd-kpi="${fila}" aria-pressed="${st.fila === fila}"><span class="rot">${rot}</span><span class="v">${v}</span><span class="pe">${pe}</span></button>`
    return `<div class="prop">
      <header class="p-cab" data-m>
        <div><h1>Pedidos</h1><p class="sub">${pedidos.length} em andamento · 7.331 no acervo · 2 sem número</p></div>
        <div class="dir rel"><span class="atualizado">Atualizado às 15:42</span><button type="button" class="btn btn-sec" id="pd-atalhos" title="Atalhos (?)">Atalhos</button><button type="button" class="btn btn-prim" id="pd-novo" title="Novo pedido (N)">Novo pedido</button>${RG('2')}</div>
      </header>


      <section class="kpis k-compacto rel" data-m>
        ${RG('1·8')}
        ${kpi('trava', 'Travam a fábrica', travam, `<span class="pill ${travam ? 'atr' : 'ok'}">${travam ? 'receber ou parte técnica' : 'nada travado'}</span>`)}
        ${kpi('perto', 'Vencem em até 3 dias', perto, perto ? `<span class="pill ate">próximos a atrasar</span>` : '<small>nenhum perto do prazo</small>')}
        ${kpi('receber', 'A receber', brl(aReceber), `<small>${pedidos.filter((p) => p.parcelas.some((c) => !c.pago)).length} pedidos com saldo</small>`)}
        ${kpi('engenharia', 'Com a engenharia', cont('engenharia'), engVencido ? `<span class="pill atr">${engVencido} com prazo vencido</span>` : '<small>todos no prazo</small>')}
      </section>

      <div class="linha-busca-pd rel" data-m>
        <div class="filas" role="tablist" aria-label="Filas">${FILAS.map(([k, r]) => `<button type="button" role="tab" class="fila ${k === 'atrasados' && cont(k) ? 'alerta' : TRAVA.has(k) && cont(k) ? 'trava' : ''}" data-pd-fila="${k}" aria-selected="${st.fila === k}">${r}<b>${cont(k)}</b></button>`).join('')}</div>
        <label class="busca-pd">${SV.busca}<input id="pd-q" type="search" value="${esc(st.q)}" placeholder="Buscar pedido, cliente ou carro  ( / )" aria-label="Buscar pedidos"></label>
        ${RG('1·2·8')}
      </div>

      <section class="cartao" data-m aria-label="Lista de pedidos">
        ${RG('3·6·7')}
        ${st.fila === 'atrasados' ? `<div class="t-topo"><h2 style="color:var(--danger)">${atrasadosL.length} pedido${atrasadosL.length === 1 ? '' : 's'} atrasado${atrasadosL.length === 1 ? '' : 's'}</h2>${atrasadosL.length ? `<span class="pill atr">o mais antigo há ${dias(atrasadosL[0].envio)} dias</span>` : ''}</div>
        <p class="c-sub">O prazo de envio já passou. Do mais atrasado para o menos, com quem precisa agir.</p>
        <div class="at-lista">${atrasadosL.length ? linhasAtraso(atrasadosL) : '<p class="pl-vazio">Nenhum pedido atrasado.</p>'}</div>` : `<div class="t-topo"><h2>${FILAS.find(([k]) => k === st.fila)?.[1] ?? (st.fila === 'perto' ? 'Vencem em até 3 dias' : 'Pedidos')}</h2><span class="atualizado">${lista.length} pedido${lista.length === 1 ? '' : 's'} · J/K andam, Enter abre</span></div>
        <div class="pl" role="table">
          <div class="pl-cab" role="row"><button type="button" data-pd-ord="num" ${sortA('num')} style="padding-left:8px">Pedido</button><button type="button" data-pd-ord="cliente" ${sortA('cliente')}>Cliente</button><span>Carro</span><button type="button" data-pd-ord="envio" ${sortA('envio')}>Envio</button><button type="button" data-pd-ord="valor" ${sortA('valor')}>Valor</button><span>O que falta</span><span></span></div>
          ${lista.length ? lista.map((p, i) => {
            const s = sit(p)
            const feito = st.feitos.get(p.id)
            const envio = p.envio ? `${dBR(p.envio)}${s === 'atr' ? `<span class="pill atr">${dias(p.envio)}d atrasado</span>` : s === 'prox' ? '<span class="pill ate">perto</span>' : ''}` : '<span class="pill">sem prazo</span>'
            const destaque = TRAVA.has(filaDe(p))
            return `<div class="pl-lin ${i === st.sel ? 'sel' : ''} ${feito ? 'feito' : ''} ${s === 'atr' ? 'atrasado' : ''}" role="row" data-pd-abrir="${p.id}">
              <span class="pl-num">${p.num}</span>
              <span class="pl-cli"><b>${esc(p.cliente)}</b><span>${p.vend} · venda ${dBR(p.venda)}${p.msgs ? ` · <span class="msg">${p.msgs} mensage${p.msgs === 1 ? 'm' : 'ns'}</span>` : ''}</span></span>
              <span class="pl-carro">${esc(p.carro)}</span>
              <span class="pl-envio">${envio}</span>
              <span class="pl-valor">${brl(p.valor)}</span>
              <span class="pl-falta">${p.falta.length ? esc(p.falta[0]) + (p.falta.length > 1 ? `<span class="mais" title="${esc(p.falta.slice(1).join(' · '))}">+${p.falta.length - 1}</span>` : '') : esc(p.fase)}</span>
              ${feito ? `<span class="pl-ok">Resolvido<button type="button" data-pd-desfazer="${p.id}">Desfazer</button></span>` : `<span class="pl-ac"><button type="button" class="btn ${destaque ? 'btn-prim' : 'btn-sec'}" data-pd-acao="${p.id}">${ROTULO[p.acao]}</button></span>`}
            </div>`
          }).join('') : '<p class="pl-vazio">Nada nesta fila. Troque de fila ou limpe a busca.</p>'}
        </div>`}
      </section>
    </div>`
  }

  // ═══════════════ GAVETA ═══════════════
  function gaveta() {
    if (st.novo) return gavetaNovo()
    const p = pedidos.find((x) => x.id === st.aberto); if (!p) return ''
    const saldo = p.parcelas.filter((c) => !c.pago).reduce((a, c) => a + c.v, 0)
    const fim = st.fim === p.id
    const secPag = `<section class="gv-sec" id="gv-pag" data-m><h3>Pagamento</h3>${p.parcelas.map((c, i) => `<div class="gv-parc"><span><span class="num">${brl(c.v)}</span><small>${esc(c.rot)}</small></span>${c.pago ? '<span class="pill ok">Pago</span>' : `<button type="button" class="btn btn-prim btn-p" data-pd-pagar="${p.id}:${i}">Marcar pago</button>`}</div>`).join('')}
      ${st.pagando ? `<form class="gv-form" id="pd-f-pago"><label class="gv-campo">Valor recebido (R$)<input id="pd-v-pago" inputmode="numeric" value="${p.parcelas[st.pagando.i].v.toLocaleString('pt-BR')}"></label>${st.erro ? `<p class="gv-erro">${st.erro}</p>` : ''}<div class="gv-linha"><button type="button" class="btn btn-sec" id="pd-cancela-pago">Cancelar</button><button type="submit" class="btn btn-prim">Confirmar recebimento</button></div></form>` : ''}</section>`
    const secPrazo = p.acao === 'informar_prazo' ? `<section class="gv-sec" data-m><h3>Prazo de envio</h3><form class="gv-form" id="pd-f-prazo"><label class="gv-campo">Enviar até<input type="date" id="pd-v-prazo" min="2026-11-12"></label>${st.erro ? `<p class="gv-erro">${st.erro}</p>` : ''}<div class="gv-linha"><button type="submit" class="btn btn-prim">Salvar prazo</button></div></form></section>` : ''
    const secFrete = p.acao === 'definir_frete' ? `<section class="gv-sec" data-m><h3>Frete</h3><form class="gv-form" id="pd-f-frete"><label class="gv-campo">Transportadora<select id="pd-v-transp"><option value="">Escolha</option><option>Rodonaves</option><option>Braspress</option><option>Jamef</option><option>Retirada na fábrica</option></select></label><label class="gv-campo">Valor do frete (R$)<input id="pd-v-frete" inputmode="numeric" placeholder="0"></label>${st.erro ? `<p class="gv-erro">${st.erro}</p>` : ''}<div class="gv-linha"><button type="submit" class="btn btn-prim">Salvar frete</button></div></form></section>` : ''
    const secAlt = p.acao === 'alteracao' ? `<section class="gv-sec" data-m><h3>Alteração pedida</h3><p>${esc(p.falta[0])}</p><div class="gv-linha"><button type="button" class="btn btn-sec" data-pd-alt="recusar">Recusar</button><button type="button" class="btn btn-prim" data-pd-alt="aprovar">Aprovar e avisar a fábrica</button></div></section>` : ''
    const secTec = (p.acao === 'fazer_ficha' || p.acao === 'conferir_enviar') ? `<section class="gv-sec" data-m><h3>Parte técnica</h3><div class="gv-linha" style="justify-content:flex-start"><button type="button" class="btn btn-prim" data-pd-tec="${p.id}">${ROTULO[p.acao]}</button></div></section>` : ''
    const secExc = st.excluir ? `<form class="gv-form" id="pd-f-exc" style="box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent)"><b>Excluir o pedido ${p.num} e todas as fichas?</b><label class="gv-campo">Digite o número do pedido para confirmar<input id="pd-v-exc" inputmode="numeric" autocomplete="off"></label><div class="gv-linha"><button type="button" class="btn btn-sec" id="pd-exc-cancela">Cancelar</button><button type="submit" class="btn btn-perigo" id="pd-exc-ok" disabled>Excluir pedido</button></div></form>` : ''
    return `<div class="gaveta-fundo" id="pd-fundo"></div><aside class="gaveta" role="dialog" aria-modal="true" aria-label="Pedido ${p.num}">
      <div class="gv-cab"><div class="t"><span class="chip-num" style="justify-self:start">Nº ${p.num}</span><h2>${esc(p.cliente)}</h2><div class="pills"><span class="pill">${esc(p.fase)}</span>${sit(p) === 'atr' ? `<span class="pill atr">${dias(p.envio)}d atrasado</span>` : ''}</div></div><button type="button" class="btn btn-sec" id="pd-fechar" title="Fechar (Esc)">Fechar</button></div>
      <div class="gv-corpo">
        ${fim ? `<div class="gv-faixa ok" data-m><b>Pedido sem pendência. A saída está liberada.</b><span>O pedido segue na fábrica: ${esc(p.fase)}.</span><div class="gv-linha" style="justify-content:flex-start"><button type="button" class="btn btn-prim" id="pd-proximo">Próximo pendente</button></div></div>`
          : `<div class="gv-faixa ${p.falta.length ? '' : 'ok'}" data-m><b>${p.falta.length ? 'O que falta' : 'Sem pendência'}</b><span>${p.falta.length ? p.falta.map(esc).join('<br>') : 'O pedido segue na fábrica: ' + esc(p.fase) + '.'}</span></div>`}
        ${secTec}${secFrete}${secPrazo}${secAlt}
        <section class="gv-sec" data-m><h3>Venda</h3><dl class="gv-dl"><div><dt>Vendedor</dt><dd>${p.vend}</dd></div><div><dt>Data da venda</dt><dd>${dBR(p.venda)}/2026</dd></div><div><dt>Carro</dt><dd>${esc(p.carro)}</dd></div><div><dt>Envio</dt><dd>${p.envio ? dBR(p.envio) + '/2026' : 'sem prazo'}</dd></div><div><dt>Valor</dt><dd>${brl(p.valor)}</dd></div><div><dt>Saldo</dt><dd>${brl(saldo)}</dd></div></dl></section>
        ${secPag}
        ${secExc}
      </div>
      <div class="gv-rod"><button type="button" class="link-perigo" id="pd-excluir">Excluir pedido</button><span class="atualizado">Esc fecha · a lista fica onde estava</span></div>
    </aside>`
  }
  function gavetaNovo() {
    return `<div class="gaveta-fundo" id="pd-fundo"></div><aside class="gaveta" role="dialog" aria-modal="true" aria-label="Novo pedido">
      <div class="gv-cab"><div class="t"><h2>Novo pedido</h2></div><button type="button" class="btn btn-sec" id="pd-fechar">Fechar</button></div>
      <form class="gv-corpo" id="pd-f-novo">
        <label class="gv-campo">Cliente<input id="pd-n-cli" required autocomplete="off"></label>
        <label class="gv-campo">Telefone<input id="pd-n-tel" inputmode="tel" placeholder="(41) 9 9999-0000"></label>
        <label class="gv-campo">Vendedor<select id="pd-n-vend"><option value="">Escolha</option><option>Amanda</option><option>Bruno</option><option>Carla</option><option>Diego</option><option>Elisa</option></select></label>
        <label class="gv-campo">Data da venda<input id="pd-n-data" type="date" max="2026-11-11" value="2026-11-11"></label>
        <label class="gv-campo">Carro<input id="pd-n-carro" placeholder="Hilux 2024 · 2&quot; · Preto"></label>
        <label class="gv-campo">Valor (R$)<input id="pd-n-valor" inputmode="numeric"></label>
        ${st.erro ? `<p class="gv-erro">${st.erro}</p>` : ''}
        <div class="gv-linha"><button type="submit" class="btn btn-prim">Salvar pedido</button></div>
      </form>
    </aside>`
  }

  const ATALHOS = `<div class="fundo" id="pd-fundo-at"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pd-t-at"><h2 id="pd-t-at">Atalhos</h2><div class="atalhos">
    <div><span>Buscar</span><kbd>/</kbd></div><div><span>Andar na lista</span><span><kbd>J</kbd> <kbd>K</kbd></span></div><div><span>Abrir o pedido</span><kbd>Enter</kbd></div>
    <div><span>Novo pedido</span><kbd>N</kbd></div><div><span>Fechar</span><kbd>Esc</kbd></div><div><span>Esta lista</span><kbd>?</kbd></div></div>
    <div class="rod"><button type="button" class="btn btn-prim" id="pd-fecha-at">Fechar</button></div></div></div>`

  function render() {
    el().innerHTML = APP.modo === 'atual' ? telaHoje() : telaProposta()
    renderCamada()
  }
  function renderCamada() { camada().innerHTML = APP.modo === 'proposta' ? (st.atalhos ? ATALHOS : (st.aberto != null || st.novo) ? gaveta() : '') : '' }

  let tId
  function toast(msg, desfazer) {
    document.querySelector('.toast')?.remove()
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status')
    t.innerHTML = `<span>${msg}</span>${desfazer ? '<button type="button" class="desfazer">Desfazer</button>' : ''}`
    document.body.appendChild(t)
    if (desfazer) t.querySelector('.desfazer').onclick = () => { t.remove(); desfazer() }
    clearTimeout(tId); tId = setTimeout(() => t.remove(), 6000)
  }
  function abrir(id, sec) {
    st.aberto = id; st.novo = false; st.excluir = false; st.pagando = null; st.erro = ''; st.fim = null; renderCamada()
    if (sec) setTimeout(() => document.getElementById(sec)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 0)
  }
  function fechar() { st.aberto = null; st.novo = false; st.atalhos = false; st.excluir = false; st.pagando = null; st.erro = ''; st.fim = null; renderCamada() }
  st.presos = new Set(); st.undos = new Map()
  function prender(p) { st.presos.add(p.id) }

  document.addEventListener('click', (e) => {
    if (APP.tela !== 'pedidos') return
    const t = e.target.closest('button, a, [data-pd-abrir], #pd-fundo, #pd-fundo-at'); if (!t) return
    const d = t.dataset
    if (d.pdhAba) { st.abaH = d.pdhAba; render(); return }
    if (d.pdhToast) { e.preventDefault(); toast(d.pdhToast + ' (tela de hoje).'); return }
    if (d.pdFila) { st.fila = d.pdFila; st.sel = -1; st.presos.clear(); render(); return }
    if (d.pdKpi) {
      const k = d.pdKpi
      if (k === 'trava') st.fila = 'receber'; else st.fila = k
      st.presos.clear(); render(); return
    }
    if (d.pdOrd) { st.ordem = { col: d.pdOrd, dir: st.ordem.col === d.pdOrd ? -st.ordem.dir : 1 }; render(); return }
    if (d.pdDesfazer) {
      e.stopPropagation(); st.undos.get(+d.pdDesfazer)?.(); document.querySelector('.toast')?.remove(); return
    }
    if (d.pdAcao) {
      e.stopPropagation()
      const p = pedidos.find((x) => x.id === +d.pdAcao)
      if (t.textContent.trim() === 'Avisar o cliente') { prender(p); const antes = p.avisado; p.avisado = true; st.feitos.set(p.id, 'aviso'); const undo = () => { p.avisado = antes; st.feitos.delete(p.id); st.undos.delete(p.id); render() }; st.undos.set(p.id, undo); render(); toast(`Aviso de nova previsão enviado ao cliente do ${p.num}.`, undo); return }
      if (p.acao === 'receber') abrir(p.id, 'gv-pag')
      else if (p.acao === 'fazer_ficha' || p.acao === 'conferir_enviar') { prender(p); resolver(p, (q) => { q.falta = []; q.fase = 'Fila de produção' }, p.acao === 'fazer_ficha' ? `Parte técnica do ${p.num} criada. O pedido foi para a fábrica.` : `Pedido ${p.num} conferido e enviado à fábrica.`) }
      else abrir(p.id)
      return
    }
    if (d.pdAbrir) { abrir(+d.pdAbrir); return }
    if (d.pdPagar) { const [, i] = d.pdPagar.split(':').map(Number); st.pagando = { i }; st.erro = ''; renderCamada(); document.getElementById('pd-v-pago')?.focus(); return }
    if (d.pdTec) { const p = pedidos.find((x) => x.id === +d.pdTec); prender(p); resolver(p, (q) => { q.falta = []; q.fase = 'Fila de produção' }, `Parte técnica do ${p.num} criada. O pedido foi para a fábrica.`); st.fim = p.id; renderCamada(); return }
    if (d.pdAlt) {
      const p = pedidos.find((x) => x.id === st.aberto); prender(p)
      resolver(p, (q) => { q.falta = []; if (d.pdAlt === 'aprovar') q.fase = 'Fila de produção · alteração aprovada' }, d.pdAlt === 'aprovar' ? `Alteração do ${p.num} aprovada. A fábrica foi avisada.` : `Alteração do ${p.num} recusada. A vendedora foi avisada.`)
      st.fim = p.id; renderCamada(); return
    }
    switch (t.id) {
      case 'pd-novo': st.novo = true; st.aberto = null; st.erro = ''; renderCamada(); document.getElementById('pd-n-cli')?.focus(); return
      case 'pd-atalhos': st.atalhos = true; renderCamada(); return
      case 'pd-fecha-at': case 'pd-fundo-at': if (t.id === 'pd-fecha-at' || e.target.id === 'pd-fundo-at') { st.atalhos = false; renderCamada() } return
      case 'pd-fechar': case 'pd-fundo': fechar(); return
      case 'pd-cancela-pago': st.pagando = null; st.erro = ''; renderCamada(); return
      case 'pd-excluir': st.excluir = true; renderCamada(); document.getElementById('pd-v-exc')?.focus(); return
      case 'pd-exc-cancela': st.excluir = false; renderCamada(); return
      case 'pd-proximo': {
        const prox = pedidos.find((x) => TRAVA.has(filaDe(x)) && x.id !== st.aberto)
        if (prox) abrir(prox.id, prox.acao === 'receber' ? 'gv-pag' : null); else { fechar(); toast('Nada mais travando a fábrica.') }
        return
      }
    }
  })
  document.addEventListener('input', (e) => {
    if (APP.tela !== 'pedidos') return
    if (e.target.id === 'pd-q') { st.q = e.target.value; st.sel = -1; render(); const q = document.getElementById('pd-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }
    if (e.target.id === 'pd-v-exc') { const p = pedidos.find((x) => x.id === st.aberto); document.getElementById('pd-exc-ok').disabled = e.target.value.trim() !== p.num }
  })
  document.addEventListener('submit', (e) => {
    if (APP.tela !== 'pedidos') return
    e.preventDefault()
    const p = pedidos.find((x) => x.id === st.aberto)
    const id = e.target.id
    if (id === 'pd-f-pago') {
      const parc = p.parcelas[st.pagando.i]
      const v = Number(document.getElementById('pd-v-pago').value.replace(/\D/g, '')) || 0
      if (!v) { st.erro = 'Informe o valor recebido.'; renderCamada(); return }
      if (v > parc.v) { st.erro = `O valor passa da parcela (${brl(parc.v)}). Confira antes de confirmar.`; renderCamada(); return }
      const i = st.pagando.i; st.pagando = null; st.erro = ''
      prender(p)
      resolver(p, (q) => {
        if (v < q.parcelas[i].v) { q.parcelas[i].v -= v; q.parcelas.splice(i, 0, { v, pago: true, rot: 'Parcial · hoje' }) } else q.parcelas[i].pago = true
        if (q.parcelas.every((c) => c.pago)) q.falta = q.falta.filter((f) => !/^Receber/.test(f))
      }, `Recebimento de ${brl(v)} registrado no ${p.num}.`)
      if (!p.falta.length || p.acao === 'acompanhar') st.fim = p.id
      renderCamada(); return
    }
    if (id === 'pd-f-prazo') {
      const v = document.getElementById('pd-v-prazo').value
      if (!v) { st.erro = 'Escolha a data.'; renderCamada(); return }
      const w = new Date(v + 'T12:00:00').getDay()
      if (v <= '2026-11-11') { st.erro = 'A data precisa ser depois de hoje.'; renderCamada(); return }
      if (w === 0 || w === 6) { st.erro = 'Sábado e domingo não têm envio. Escolha um dia útil.'; renderCamada(); return }
      st.erro = ''; prender(p)
      resolver(p, (q) => { q.envio = v; q.falta = q.falta.filter((f) => !/prazo/i.test(f)) }, `Prazo de envio do ${p.num}: ${dBR(v)}.`)
      st.fim = p.id; renderCamada(); return
    }
    if (id === 'pd-f-frete') {
      const tr = document.getElementById('pd-v-transp').value, vf = Number(document.getElementById('pd-v-frete').value.replace(/\D/g, '')) || 0
      if (!tr) { st.erro = 'Escolha a transportadora ou Retirada na fábrica.'; renderCamada(); return }
      if (!vf && tr !== 'Retirada na fábrica') { st.erro = 'Informe o valor do frete.'; renderCamada(); return }
      st.erro = ''; prender(p)
      resolver(p, (q) => { q.falta = q.falta.filter((f) => f !== 'Definir frete') }, `Frete do ${p.num}: ${tr}${vf ? ' · ' + brl(vf) : ''}.`)
      if (!p.falta.length) st.fim = p.id
      renderCamada(); return
    }
    if (id === 'pd-f-exc') {
      const idx = pedidos.findIndex((x) => x.id === p.id); const [rem] = pedidos.splice(idx, 1)
      fechar(); render()
      toast(`Pedido ${rem.num} excluído.`, () => { pedidos.splice(idx, 0, rem); render() })
      return
    }
    if (id === 'pd-f-novo') {
      const v = (k) => document.getElementById(k).value.trim()
      const tel = v('pd-n-tel').replace(/\D/g, '')
      if (!v('pd-n-cli')) { st.erro = 'Informe o cliente.'; renderCamada(); return }
      if (tel && tel.length < 10) { st.erro = 'Telefone com DDD: 10 ou 11 números.'; renderCamada(); return }
      if (!v('pd-n-vend')) { st.erro = 'Escolha o vendedor.'; renderCamada(); return }
      if (!(Number(v('pd-n-valor').replace(/\D/g, '')) > 0)) { st.erro = 'Informe o valor da venda.'; renderCamada(); return }
      const novo = { id: Date.now(), num: String(26100370 + pedidos.length), cliente: v('pd-n-cli'), vend: v('pd-n-vend'), venda: v('pd-n-data') || '2026-11-11', carro: v('pd-n-carro') || '—', envio: null, valor: Number(v('pd-n-valor').replace(/\D/g, '')), acao: 'fazer_ficha', falta: ['Criar parte técnica'], fase: 'Parte técnica', msgs: 0, parcelas: [{ v: Number(v('pd-n-valor').replace(/\D/g, '')), pago: false, rot: 'À vista' }] }
      pedidos.unshift(novo); fechar(); st.fila = 'tecnica'; render()
      toast(`Pedido ${novo.num} salvo. Ele está em Parte técnica.`, () => { pedidos = pedidos.filter((x) => x.id !== novo.id); render() })
    }
  })
  document.addEventListener('keydown', (e) => {
    if (APP.tela !== 'pedidos' || APP.modo !== 'proposta') return
    if (e.key === 'Escape') { if (st.aberto != null || st.novo || st.atalhos) fechar(); else if (document.activeElement?.id === 'pd-q') document.activeElement.blur(); return }
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName) || st.aberto != null || st.novo) return
    const lista = visiveis()
    if (e.key === '/') { e.preventDefault(); document.getElementById('pd-q')?.focus() }
    else if (e.key.toLowerCase() === 'j') { st.sel = Math.min(lista.length - 1, st.sel + 1); render() }
    else if (e.key.toLowerCase() === 'k') { st.sel = Math.max(0, st.sel - 1); render() }
    else if (e.key === 'Enter' && st.sel >= 0) abrir(lista[st.sel].id)
    else if (e.key.toLowerCase() === 'n') { e.preventDefault(); st.novo = true; renderCamada(); document.getElementById('pd-n-cli')?.focus() }
    else if (e.key === '?') { st.atalhos = true; renderCamada() }
  })

  const regras = `<aside class="painel-regras" id="painel-regras" aria-label="As 8 regras de ouro nesta tela"><h2>As 8 regras de ouro em Pedidos</h2><ol>
    <li><span class="n">1</span><div><b>Consistência</b><span>As 5 abas e a folha de filtros viraram uma lista só, com filas. Mesmo cartão e mesma linha do painel comercial.</span></div></li>
    <li><span class="n">2</span><div><b>Atalhos e uso por todos</b><span>/ busca, J e K andam, Enter abre, N novo pedido, Esc fecha. No celular os botões têm 48 px.</span></div></li>
    <li><span class="n">3</span><div><b>Retorno claro</b><span>A aba Atrasados fica em vermelho com o contador; na lista, a linha atrasada tem faixa vermelha. A linha resolvida fica verde no lugar.</span></div></li>
    <li><span class="n">4</span><div><b>Diálogo que termina</b><span>Receber: valor, confirmar e "Pedido sem pendência. A saída está liberada.", com o botão Próximo pendente.</span></div></li>
    <li><span class="n">5</span><div><b>Evitar erro</b><span>A lixeira saiu de cada linha: excluir fica no pedido e pede o número. Valor acima da parcela não passa; prazo não aceita data passada nem fim de semana.</span></div></li>
    <li><span class="n">6</span><div><b>Desfazer fácil</b><span>Pagamento, prazo, frete, parte técnica, alteração, exclusão e novo pedido têm Desfazer.</span></div></li>
    <li><span class="n">7</span><div><b>Quem manda é a pessoa</b><span>Nada some da lista depois da ação; a linha só sai quando a pessoa troca de fila. A gaveta abre por cima e a lista fica onde estava.</span></div></li>
    <li><span class="n">8</span><div><b>Menos coisa pra lembrar</b><span>A aba Atrasados já diz os dias de atraso e quem precisa agir (ADM ou fábrica). O que falta e o botão certo estão na própria linha; a gaveta traz venda, carro e parcelas juntos; cada fila mostra quantos tem.</span></div></li>
  </ol></aside>`

  TELAS.pedidos = { render, regras, fechar }
})()
</script>
<script>
(function () {
  // ── Roteador da demo: menu, controle do apresentador, grade ──────────────
  const marcar = () => {
    document.querySelectorAll('[data-tela]').forEach((b) => b.toggleAttribute('aria-current', b.dataset.tela === APP.tela))
    document.getElementById('b-atual').setAttribute('aria-pressed', APP.modo === 'atual')
    document.getElementById('b-prop').setAttribute('aria-pressed', APP.modo === 'proposta')
  }
  function renderTela() {
    Object.values(TELAS).forEach((t) => t.fechar?.())
    document.querySelector('.toast')?.remove()
    TELAS[APP.tela].render()
    marcar()
    if (document.documentElement.classList.contains('regras')) {
      document.getElementById('painel-regras')?.remove()
      document.body.insertAdjacentHTML('beforeend', TELAS[APP.tela].regras)
    }
    document.getElementById('area').scrollTop = 0
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return
    if (t.dataset.tela) { APP.tela = t.dataset.tela; try { location.hash = t.dataset.tela } catch {} renderTela(); return }
    if (t.id === 'b-atual' || t.id === 'b-prop') { APP.modo = t.id === 'b-atual' ? 'atual' : 'proposta'; renderTela(); return }
    if (t.id === 'b-grade') {
      const on = document.documentElement.classList.toggle('grade')
      t.setAttribute('aria-pressed', on)
      if (!on) { med.hidden = true; alvoM?.classList.remove('alvo'); alvoM = null }
      return
    }
    if (t.id === 'b-regras') {
      const on = document.documentElement.classList.toggle('regras')
      t.setAttribute('aria-pressed', on)
      document.getElementById('painel-regras')?.remove()
      if (on) { document.body.insertAdjacentHTML('beforeend', TELAS[APP.tela].regras); if (APP.modo !== 'proposta') APP.modo = 'proposta' }
      renderTela()
    }
  })
  const med = document.getElementById('medida'); let alvoM = null
  const el = document.getElementById('conteudo')
  document.addEventListener('mousemove', (e) => {
    if (!document.documentElement.classList.contains('grade')) return
    const a = e.target.closest('#conteudo [data-m]')
    if (a !== alvoM) { alvoM?.classList.remove('alvo'); alvoM = a; a?.classList.add('alvo') }
    if (!a) { med.hidden = true; return }
    const r = a.getBoundingClientRect(), base = el.getBoundingClientRect()
    const h = Math.round(r.height), y = Math.round(r.top - base.top)
    med.textContent = `altura ${h} · topo ${y}`
    med.classList.toggle('fora', h % 8 !== 0 || y % 8 !== 0)
    med.hidden = false
    med.style.left = Math.min(e.clientX + 16, innerWidth - med.offsetWidth - 8) + 'px'
    med.style.top = (e.clientY + 16) + 'px'
  })
  const h = (location.hash || '').slice(1)
  if (TELAS[h]) APP.tela = h
  renderTela()
})()
</script>
